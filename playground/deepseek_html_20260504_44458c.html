<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扫雷 - Minesweeper</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'bounce-in': 'bounceIn 0.3s ease-out',
              shake: 'shake 0.5s ease-in-out',
              pop: 'pop 0.2s ease-out',
            },
            keyframes: {
              bounceIn: {
                '0%': { transform: 'scale(0.3)', opacity: '0' },
                '50%': { transform: 'scale(1.05)' },
                '70%': { transform: 'scale(0.95)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-4px)' },
                '20%, 40%, 60%, 80%': { transform: 'translateX(4px)' },
              },
              pop: {
                '0%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.2)' },
                '100%': { transform: 'scale(1)' },
              },
            },
          },
        },
      }
    </script>

    <style>
      /* 自定义样式 */
      :root {
        --cell-size: 40px;
        --cell-gap: 1px;
      }

      /* 数字颜色 */
      .mine-num-1 {
        color: #2563eb;
      }
      .mine-num-2 {
        color: #16a34a;
      }
      .mine-num-3 {
        color: #dc2626;
      }
      .mine-num-4 {
        color: #1e3a8a;
      }
      .mine-num-5 {
        color: #7f1d1d;
      }
      .mine-num-6 {
        color: #0d9488;
      }
      .mine-num-7 {
        color: #1f2937;
      }
      .mine-num-8 {
        color: #6b7280;
      }

      /* 格子基础样式 */
      .cell {
        width: var(--cell-size);
        height: var(--cell-size);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-weight: 700;
        font-size: calc(var(--cell-size) * 0.5);
        transition:
          background-color 0.1s ease,
          transform 0.05s ease;
        position: relative;
        border-radius: 2px;
      }

      /* 未揭开 - 3D凸起效果 */
      .cell-covered {
        background: linear-gradient(145deg, #e2e8f0 0%, #cbd5e1 40%, #94a3b8 100%);
        border-top: 2px solid #f1f5f9;
        border-left: 2px solid #f1f5f9;
        border-right: 2px solid #64748b;
        border-bottom: 2px solid #475569;
        box-shadow:
          1px 1px 2px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .cell-covered:hover {
        background: linear-gradient(145deg, #f1f5f9 0%, #e2e8f0 40%, #cbd5e1 100%);
        border-top-color: #ffffff;
        border-left-color: #ffffff;
      }
      .cell-covered:active {
        border-top: 2px solid #64748b;
        border-left: 2px solid #64748b;
        border-right: 2px solid #e2e8f0;
        border-bottom: 2px solid #e2e8f0;
        background: #cbd5e1;
        box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.3);
        transform: scale(0.96);
      }

      /* 已揭开 */
      .cell-revealed {
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        cursor: default;
        box-shadow: inset 1px 1px 1px rgba(0, 0, 0, 0.08);
      }
      .cell-revealed:hover {
        background: #e8ecf1;
      }

      /* 地雷爆炸 */
      .cell-exploded {
        background: #fca5a5 !important;
        border: 2px solid #dc2626 !important;
        animation: shake 0.5s ease-in-out;
        z-index: 10;
        box-shadow: 0 0 16px rgba(220, 38, 38, 0.6) !important;
      }

      /* 旗帜标记 */
      .cell-flagged {
        background: linear-gradient(145deg, #e2e8f0 0%, #cbd5e1 40%, #94a3b8 100%);
        border-top: 2px solid #f1f5f9;
        border-left: 2px solid #f1f5f9;
        border-right: 2px solid #64748b;
        border-bottom: 2px solid #475569;
        box-shadow:
          1px 1px 2px rgba(0, 0, 0, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      /* 游戏面板网格 */
      .game-grid {
        display: grid;
        gap: var(--cell-gap);
        background: #94a3b8;
        padding: 4px;
        border-radius: 8px;
        box-shadow:
          0 4px 6px rgba(0, 0, 0, 0.15),
          0 10px 20px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 3px solid #64748b;
        width: fit-content;
      }

      /* 滚动条美化 */
      .scrollbar-thin::-webkit-scrollbar {
        height: 6px;
        width: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* 难度按钮激活状态 */
      .difficulty-active {
        box-shadow:
          0 0 0 3px rgba(59, 130, 246, 0.5),
          0 4px 12px rgba(59, 130, 246, 0.3);
        transform: translateY(-2px);
      }

      /* 模式切换按钮 */
      .mode-active-flag {
        background: #fef3c7 !important;
        border-color: #f59e0b !important;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4) !important;
      }

      /* 响应式调整 */
      @media (max-width: 640px) {
        .cell {
          border-radius: 1px;
        }
        .game-grid {
          padding: 2px;
          border-radius: 6px;
          border-width: 2px;
        }
      }

      /* 胜利粒子效果容器 */
      .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 100;
      }
      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        animation: confettiFall 1.5s ease-in forwards;
      }
      @keyframes confettiFall {
        0% {
          transform: translateY(-100px) rotate(0deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: translateY(105vh) rotate(720deg) scale(0.3);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-slate-800 via-slate-700 to-slate-900 flex flex-col items-center py-4 px-2 sm:py-8 sm:px-4">
    <!-- 主容器 -->
    <div class="w-full max-w-[960px] flex flex-col items-center gap-3 sm:gap-5">
      <!-- 标题 -->
      <h1 class="text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-300 drop-shadow-lg tracking-wider select-none">
        💣 扫 雷 💣
      </h1>

      <!-- 难度选择 -->
      <div class="flex flex-wrap gap-2 sm:gap-3 justify-center" id="difficulty-buttons">
        <button
          data-difficulty="easy"
          class="difficulty-active px-4 sm:px-6 py-2 sm:py-2.5 rounded-full font-bold text-sm sm:text-base transition-all duration-200 bg-gradient-to-r from-emerald-400 to-green-500 text-white shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 border-2 border-emerald-300"
        >
          😊 初级 9×9
        </button>
        <button
          data-difficulty="medium"
          class="px-4 sm:px-6 py-2 sm:py-2.5 rounded-full font-bold text-sm sm:text-base transition-all duration-200 bg-gradient-to-r from-amber-400 to-orange-500 text-white shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 border-2 border-amber-300"
        >
          😐 中级 16×16
        </button>
        <button
          data-difficulty="hard"
          class="px-4 sm:px-6 py-2 sm:py-2.5 rounded-full font-bold text-sm sm:text-base transition-all duration-200 bg-gradient-to-r from-rose-400 to-red-600 text-white shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 border-2 border-rose-300"
        >
          😈 高级 30×16
        </button>
      </div>

      <!-- 信息栏 -->
      <div class="flex items-center gap-3 sm:gap-6 bg-slate-700/60 backdrop-blur-sm rounded-2xl px-4 sm:px-8 py-3 shadow-xl border border-slate-500/30">
        <!-- 地雷计数 -->
        <div class="flex items-center gap-2">
          <span class="text-xl sm:text-2xl">💣</span>
          <span id="mine-counter" class="text-2xl sm:text-3xl font-mono font-bold text-red-400 min-w-[40px] sm:min-w-[50px] text-center tabular-nums"> 10 </span>
        </div>

        <!-- 重置按钮 / 表情 -->
        <button
          id="reset-button"
          class="text-3xl sm:text-4xl w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-gradient-to-b from-slate-500 to-slate-600 shadow-lg hover:shadow-xl hover:scale-110 active:scale-90 transition-all duration-200 border-2 border-slate-400 flex items-center justify-center select-none"
          title="重新开始"
        >
          😊
        </button>

        <!-- 计时器 -->
        <div class="flex items-center gap-2">
          <span class="text-xl sm:text-2xl">⏱️</span>
          <span id="timer" class="text-2xl sm:text-3xl font-mono font-bold text-cyan-400 min-w-[50px] sm:min-w-[60px] text-center tabular-nums"> 0 </span>
        </div>
      </div>

      <!-- 模式切换按钮（移动端友好） -->
      <div class="flex items-center gap-3">
        <span class="text-xs sm:text-sm text-slate-400 select-none">模式：</span>
        <button
          id="mode-toggle"
          class="px-4 py-2 rounded-full font-bold text-sm transition-all duration-200 bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-lg border-2 border-sky-400 hover:shadow-xl hover:scale-105 active:scale-95 flex items-center gap-2 select-none"
          title="切换挖掘/标记模式（或使用右键标记）"
        >
          <span id="mode-icon">⛏️</span>
          <span id="mode-label">挖掘</span>
        </button>
      </div>

      <!-- 游戏面板容器 -->
      <div class="relative scrollbar-thin overflow-auto max-w-full rounded-lg" id="board-container">
        <div class="game-grid" id="game-board">
          <!-- 动态生成 -->
        </div>
      </div>

      <!-- 提示信息 -->
      <div class="text-xs sm:text-sm text-slate-400 text-center select-none max-w-md leading-relaxed">
        💡 提示：<span class="text-slate-300">左键挖掘</span> · <span class="text-slate-300">右键标记旗帜</span> ·
        <span class="text-slate-300">点击数字自动展开</span>
        <br class="hidden sm:block" />
        <span class="text-slate-400">移动端可切换挖掘/标记模式</span>
      </div>
    </div>

    <!-- 胜利彩带容器 -->
    <div class="confetti-container" id="confetti-container"></div>

    <script>
      ;(function () {
        // ============ 游戏配置 ============
        const DIFFICULTIES = {
          easy: { rows: 9, cols: 9, mines: 10, label: '初级 9×9', emoji: '😊' },
          medium: { rows: 16, cols: 16, mines: 40, label: '中级 16×16', emoji: '😐' },
          hard: { rows: 16, cols: 30, mines: 99, label: '高级 30×16', emoji: '😈' },
        }

        // ============ DOM元素引用 ============
        const gameBoard = document.getElementById('game-board')
        const boardContainer = document.getElementById('board-container')
        const mineCounterEl = document.getElementById('mine-counter')
        const timerEl = document.getElementById('timer')
        const resetButton = document.getElementById('reset-button')
        const modeToggle = document.getElementById('mode-toggle')
        const modeIcon = document.getElementById('mode-icon')
        const modeLabel = document.getElementById('mode-label')
        const confettiContainer = document.getElementById('confetti-container')
        const difficultyButtons = document.querySelectorAll('#difficulty-buttons button')

        // ============ 游戏状态 ============
        let currentDifficulty = 'easy'
        let config = DIFFICULTIES[currentDifficulty]
        let rows = config.rows
        let cols = config.cols
        let totalMines = config.mines

        let board = [] // board[r][c] = { mine, revealed, flagged, adjacentMines, exploded }
        let gameState = 'idle' // 'idle' | 'playing' | 'won' | 'lost'
        let minesRemaining = totalMines
        let timerValue = 0
        let timerInterval = null
        let firstClickDone = false
        let minesPlaced = false
        let flagMode = false // false=挖掘模式, true=标记模式
        let totalSafeCells = 0
        let revealedCount = 0
        let cellSize = 40

        // ============ 初始化游戏 ============
        function initGame() {
          // 停止计时器
          clearInterval(timerInterval)
          timerInterval = null
          timerValue = 0
          timerEl.textContent = '0'

          // 重置状态
          config = DIFFICULTIES[currentDifficulty]
          rows = config.rows
          cols = config.cols
          totalMines = config.mines
          minesRemaining = totalMines
          gameState = 'idle'
          firstClickDone = false
          minesPlaced = false
          revealedCount = 0
          totalSafeCells = rows * cols - totalMines
          mineCounterEl.textContent = totalMines
          resetButton.textContent = '😊'
          timerEl.textContent = '0'

          // 初始化棋盘
          board = []
          for (let r = 0; r < rows; r++) {
            board[r] = []
            for (let c = 0; c < cols; c++) {
              board[r][c] = {
                mine: false,
                revealed: false,
                flagged: false,
                adjacentMines: 0,
                exploded: false,
              }
            }
          }

          // 计算合适的格子大小
          calculateCellSize()

          // 渲染面板
          renderBoard()

          // 更新面板样式
          updateGridStyle()

          // 清除彩带
          confettiContainer.innerHTML = ''

          // 更新难度按钮状态
          updateDifficultyButtons()

          // 更新模式按钮
          updateModeButton()
        }

        function calculateCellSize() {
          const vw = window.innerWidth
          const vh = window.innerHeight
          const maxWidth = Math.min(vw - 32, 960) // 可用宽度
          const maxHeight = vh - 380 // 减去UI元素高度

          let sizeByWidth = Math.floor(maxWidth / cols)
          let sizeByHeight = Math.floor(maxHeight / rows)

          let idealSize = Math.min(sizeByWidth, sizeByHeight)

          // 限制范围
          const minSize = 22
          const maxSize = 48
          idealSize = Math.max(minSize, Math.min(maxSize, idealSize))

          // 在移动端稍微缩小
          if (vw < 640) {
            idealSize = Math.max(minSize, idealSize - 2)
          }

          cellSize = idealSize
          document.documentElement.style.setProperty('--cell-size', cellSize + 'px')
          document.documentElement.style.setProperty('--cell-gap', cellSize <= 26 ? '0.5px' : '1px')
        }

        function updateGridStyle() {
          gameBoard.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`
          gameBoard.style.gridTemplateRows = `repeat(${rows}, var(--cell-size))`
        }

        // ============ 渲染面板 ============
        function renderBoard() {
          gameBoard.innerHTML = ''
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cell = document.createElement('div')
              cell.className = 'cell cell-covered'
              cell.dataset.row = r
              cell.dataset.col = c
              cell.title = ''
              gameBoard.appendChild(cell)
            }
          }
          updateGridStyle()
        }

        function updateCellElement(r, c) {
          const cellEl = getCellElement(r, c)
          if (!cellEl) return

          const cellData = board[r][c]

          // 清除所有状态类
          cellEl.classList.remove('cell-covered', 'cell-revealed', 'cell-exploded', 'cell-flagged')
          cellEl.innerHTML = ''

          if (cellData.revealed) {
            if (cellData.mine) {
              // 地雷被揭开
              cellEl.classList.add('cell-revealed')
              if (cellData.exploded) {
                cellEl.classList.add('cell-exploded')
              }
              cellEl.innerHTML = '💣'
              cellEl.style.fontSize = cellSize * 0.55 + 'px'
            } else if (cellData.adjacentMines > 0) {
              cellEl.classList.add('cell-revealed')
              const num = cellData.adjacentMines
              cellEl.innerHTML = num
              cellEl.classList.add('mine-num-' + num)
              cellEl.style.fontSize = cellSize * 0.5 + 'px'
            } else {
              cellEl.classList.add('cell-revealed')
              cellEl.innerHTML = ''
            }
          } else if (cellData.flagged) {
            cellEl.classList.add('cell-flagged')
            cellEl.innerHTML = '🚩'
            cellEl.style.fontSize = cellSize * 0.55 + 'px'
          } else {
            cellEl.classList.add('cell-covered')
            cellEl.innerHTML = ''
          }

          // 游戏结束时的特殊显示
          if (gameState === 'lost' && !cellData.revealed && cellData.mine && !cellData.flagged) {
            // 未标记的地雷 - 显示出来
            cellEl.classList.remove('cell-covered', 'cell-flagged')
            cellEl.classList.add('cell-revealed')
            cellEl.innerHTML = '💣'
            cellEl.style.fontSize = cellSize * 0.5 + 'px'
            cellEl.style.opacity = '0.7'
          }
          if (gameState === 'lost' && cellData.flagged && !cellData.mine) {
            // 错误标记
            cellEl.classList.remove('cell-flagged')
            cellEl.classList.add('cell-revealed')
            cellEl.innerHTML = '❌'
            cellEl.style.fontSize = cellSize * 0.5 + 'px'
            cellEl.style.opacity = '0.8'
          }
          if (gameState === 'won' && cellData.mine && !cellData.flagged) {
            // 胜利时自动标记所有地雷
            cellEl.classList.remove('cell-covered')
            cellEl.classList.add('cell-flagged')
            cellEl.innerHTML = '🚩'
            cellEl.style.fontSize = cellSize * 0.55 + 'px'
            cellEl.style.opacity = '0.9'
          }
        }

        function getCellElement(r, c) {
          return gameBoard.querySelector(`[data-row="${r}"][data-col="${c}"]`)
        }

        function updateAllCells() {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              updateCellElement(r, c)
            }
          }
        }

        // ============ 放置地雷 ============
        function placeMines(safeRow, safeCol) {
          // 安全区域：首次点击位置及其周围8个格子
          const safeZone = new Set()
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = safeRow + dr
              const nc = safeCol + dc
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                safeZone.add(nr * cols + nc)
              }
            }
          }

          // 可用位置（排除安全区域）
          const availablePositions = []
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!safeZone.has(r * cols + c)) {
                availablePositions.push({ r, c })
              }
            }
          }

          // 如果需要的地雷数超过可用位置，调整地雷数
          const minesToPlace = Math.min(totalMines, availablePositions.length)

          // Fisher-Yates 洗牌并选取前minesToPlace个位置
          for (let i = availablePositions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1))
            ;[availablePositions[i], availablePositions[j]] = [availablePositions[j], availablePositions[i]]
          }

          // 放置地雷
          for (let i = 0; i < minesToPlace; i++) {
            const { r, c } = availablePositions[i]
            board[r][c].mine = true
          }

          // 如果实际放置的地雷数少于配置（极端情况），调整计数
          totalMines = minesToPlace
          minesRemaining = totalMines
          totalSafeCells = rows * cols - totalMines
          mineCounterEl.textContent = totalMines

          // 计算每个格子的相邻地雷数
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (!board[r][c].mine) {
                board[r][c].adjacentMines = countAdjacentMines(r, c)
              }
            }
          }

          minesPlaced = true
        }

        function countAdjacentMines(r, c) {
          let count = 0
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue
              const nr = r + dr
              const nc = c + dc
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                count++
              }
            }
          }
          return count
        }

        // ============ 揭开格子 ============
        function revealCell(r, c) {
          if (r < 0 || r >= rows || c < 0 || c >= cols) return
          if (board[r][c].revealed) return
          if (board[r][c].flagged) return
          if (gameState === 'lost' || gameState === 'won') return

          // 如果是地雷，游戏失败
          if (board[r][c].mine) {
            board[r][c].revealed = true
            board[r][c].exploded = true
            gameState = 'lost'
            revealAllMines()
            updateAllCells()
            resetButton.textContent = '😵'
            stopTimer()
            shakeBoard()
            return
          }

          // 揭开当前格子
          board[r][c].revealed = true
          revealedCount++
          updateCellElement(r, c)

          // 如果是空白格（周围无地雷），递归揭开相邻格子
          if (board[r][c].adjacentMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue
                revealCell(r + dr, c + dc)
              }
            }
          }

          // 检查胜利
          checkWin()
        }

        function revealAllMines() {
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (board[r][c].mine && !board[r][c].revealed && !board[r][c].flagged) {
                board[r][c].revealed = true
              }
              if (board[r][c].flagged && !board[r][c].mine) {
                // 错误标记保持flagged状态，在updateCellElement中特殊处理
              }
            }
          }
        }

        function chordReveal(r, c) {
          // 和弦操作：如果已揭开的数字格周围旗帜数等于该数字，自动揭开周围未标记格
          if (!board[r][c].revealed) return
          if (board[r][c].adjacentMines === 0) return
          if (gameState === 'lost' || gameState === 'won') return

          // 计算周围旗帜数
          let flagCount = 0
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue
              const nr = r + dr
              const nc = c + dc
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].flagged) {
                flagCount++
              }
            }
          }

          // 如果旗帜数等于数字，揭开周围未标记格
          if (flagCount === board[r][c].adjacentMines) {
            let hitMine = false
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue
                const nr = r + dr
                const nc = c + dc
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  if (!board[nr][nc].revealed && !board[nr][nc].flagged) {
                    if (board[nr][nc].mine) {
                      hitMine = true
                      board[nr][nc].revealed = true
                      board[nr][nc].exploded = true
                    } else {
                      // 使用非递归揭开（避免和弦中的和弦）
                      simpleReveal(nr, nc)
                    }
                  }
                }
              }
            }

            if (hitMine) {
              gameState = 'lost'
              revealAllMines()
              updateAllCells()
              resetButton.textContent = '😵'
              stopTimer()
              shakeBoard()
            } else {
              updateAllCells()
              checkWin()
            }
          }
        }

        function simpleReveal(r, c) {
          if (r < 0 || r >= rows || c < 0 || c >= cols) return
          if (board[r][c].revealed) return
          if (board[r][c].flagged) return
          if (board[r][c].mine) return // 安全检查

          board[r][c].revealed = true
          revealedCount++

          // 如果是空白格，递归揭开
          if (board[r][c].adjacentMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue
                simpleReveal(r + dr, c + dc)
              }
            }
          }
        }

        // ============ 标记旗帜 ============
        function toggleFlag(r, c) {
          if (board[r][c].revealed) return
          if (gameState === 'lost' || gameState === 'won') return

          if (board[r][c].flagged) {
            board[r][c].flagged = false
            minesRemaining++
          } else {
            board[r][c].flagged = true
            minesRemaining--
          }

          mineCounterEl.textContent = minesRemaining
          updateCellElement(r, c)

          // 标记后也检查胜利（如果所有地雷都被正确标记且所有安全格都被揭开）
          checkWin()
        }

        // ============ 检查胜利 ============
        function checkWin() {
          if (gameState === 'lost' || gameState === 'won') return

          // 胜利条件：所有安全格都被揭开
          if (revealedCount >= totalSafeCells) {
            gameState = 'won'
            // 自动标记所有未标记的地雷
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                if (board[r][c].mine && !board[r][c].flagged) {
                  board[r][c].flagged = true
                }
              }
            }
            minesRemaining = 0
            mineCounterEl.textContent = '0'
            updateAllCells()
            resetButton.textContent = '😎'
            stopTimer()
            spawnConfetti()
          }
        }

        // ============ 计时器 ============
        function startTimer() {
          if (timerInterval) return
          timerInterval = setInterval(() => {
            timerValue++
            timerEl.textContent = Math.min(timerValue, 999)
          }, 1000)
        }

        function stopTimer() {
          clearInterval(timerInterval)
          timerInterval = null
        }

        // ============ 事件处理 ============
        function handleCellClick(r, c, event) {
          if (gameState === 'lost' || gameState === 'won') return

          // 首次点击
          if (!firstClickDone) {
            firstClickDone = true
            // 放置地雷（确保首次点击安全）
            if (!minesPlaced) {
              placeMines(r, c)
            }
            gameState = 'playing'
            startTimer()
            // 揭开首次点击位置
            revealCell(r, c)
            updateAllCells()
            return
          }

          if (!minesPlaced) {
            // 极端情况：首次点击后仍未放置地雷
            placeMines(r, c)
            gameState = 'playing'
            startTimer()
          }

          if (gameState !== 'playing') return

          // 根据模式处理
          if (flagMode) {
            // 标记模式
            if (!board[r][c].revealed) {
              toggleFlag(r, c)
            } else if (board[r][c].adjacentMines > 0) {
              // 已揭开的数字格 - 触发和弦
              chordReveal(r, c)
            }
          } else {
            // 挖掘模式
            if (board[r][c].flagged) return // 已标记的跳过
            if (board[r][c].revealed && board[r][c].adjacentMines > 0) {
              // 已揭开的数字格 - 触发和弦
              chordReveal(r, c)
            } else if (!board[r][c].revealed) {
              revealCell(r, c)
              updateAllCells()
            }
          }
        }

        function handleCellRightClick(r, c, event) {
          event.preventDefault()
          if (gameState === 'lost' || gameState === 'won') return

          // 首次点击通过右键标记不算（不触发首次点击逻辑）
          if (!firstClickDone) {
            // 允许在首次点击前标记
            toggleFlag(r, c)
            return
          }

          if (gameState !== 'playing') return
          toggleFlag(r, c)
        }

        function handleCellDoubleClick(r, c, event) {
          if (gameState !== 'playing') return
          if (board[r][c].revealed && board[r][c].adjacentMines > 0) {
            chordReveal(r, c)
          }
        }

        // 使用事件委托
        gameBoard.addEventListener('click', function (event) {
          const cellEl = event.target.closest('[data-row]')
          if (!cellEl) return
          const r = parseInt(cellEl.dataset.row)
          const c = parseInt(cellEl.dataset.col)
          handleCellClick(r, c, event)
        })

        gameBoard.addEventListener('contextmenu', function (event) {
          const cellEl = event.target.closest('[data-row]')
          if (!cellEl) return
          const r = parseInt(cellEl.dataset.row)
          const c = parseInt(cellEl.dataset.col)
          handleCellRightClick(r, c, event)
        })

        gameBoard.addEventListener('dblclick', function (event) {
          const cellEl = event.target.closest('[data-row]')
          if (!cellEl) return
          const r = parseInt(cellEl.dataset.row)
          const c = parseInt(cellEl.dataset.col)
          handleCellDoubleClick(r, c, event)
        })

        // 防止移动端长按弹出菜单
        gameBoard.addEventListener(
          'touchstart',
          function (event) {
            if (event.target.closest('[data-row]')) {
              // 不阻止默认行为，但使用passive模式
            }
          },
          { passive: true },
        )

        // 防止整个面板的右键菜单（在游戏进行中）
        gameBoard.addEventListener('contextmenu', function (event) {
          if (event.target.closest('[data-row]')) {
            event.preventDefault()
          }
        })

        // ============ 面板震动效果 ============
        function shakeBoard() {
          const grid = gameBoard
          grid.style.animation = 'shake 0.5s ease-in-out'
          setTimeout(() => {
            grid.style.animation = ''
          }, 500)
        }

        // ============ 胜利彩带 ============
        function spawnConfetti() {
          const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6FB7', '#845EC2', '#FF9671', '#00C9A7', '#F9F871', '#FF8A5C', '#EA5455', '#2ECC71']

          const fragment = document.createDocumentFragment()
          const count = 80

          for (let i = 0; i < count; i++) {
            const piece = document.createElement('div')
            piece.className = 'confetti-piece'
            piece.style.left = Math.random() * 100 + '%'
            piece.style.top = -(Math.random() * 40 + 10) + 'px'
            piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]
            piece.style.width = Math.random() * 10 + 6 + 'px'
            piece.style.height = Math.random() * 10 + 6 + 'px'
            piece.style.animationDelay = Math.random() * 1.2 + 's'
            piece.style.animationDuration = Math.random() * 1.5 + 1.5 + 's'
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px'
            fragment.appendChild(piece)
          }

          confettiContainer.appendChild(fragment)

          // 清除彩带
          setTimeout(() => {
            confettiContainer.innerHTML = ''
          }, 3000)
        }

        // ============ 模式切换 ============
        function updateModeButton() {
          if (flagMode) {
            modeIcon.textContent = '🚩'
            modeLabel.textContent = '标记'
            modeToggle.classList.add('mode-active-flag')
            modeToggle.classList.remove('from-sky-500', 'to-blue-600', 'border-sky-400')
            modeToggle.classList.add('from-amber-400', 'to-orange-500', 'border-amber-400')
          } else {
            modeIcon.textContent = '⛏️'
            modeLabel.textContent = '挖掘'
            modeToggle.classList.remove('mode-active-flag', 'from-amber-400', 'to-orange-500', 'border-amber-400')
            modeToggle.classList.add('from-sky-500', 'to-blue-600', 'border-sky-400')
          }
        }

        modeToggle.addEventListener('click', function () {
          flagMode = !flagMode
          updateModeButton()
          // 添加点击动画
          modeToggle.style.transform = 'scale(0.9)'
          setTimeout(() => {
            modeToggle.style.transform = ''
          }, 100)
        })

        // 键盘快捷键切换模式
        document.addEventListener('keydown', function (event) {
          if (event.key === 'f' || event.key === 'F') {
            if (!event.ctrlKey && !event.metaKey && !event.altKey) {
              flagMode = !flagMode
              updateModeButton()
            }
          }
          // 按R重置
          if (event.key === 'r' || event.key === 'R') {
            if (!event.ctrlKey && !event.metaKey && !event.altKey) {
              initGame()
            }
          }
        })

        // ============ 重置按钮 ============
        resetButton.addEventListener('click', function () {
          initGame()
          // 动画
          resetButton.style.transform = 'scale(0.8) rotate(-20deg)'
          setTimeout(() => {
            resetButton.style.transform = 'scale(1.1) rotate(10deg)'
            setTimeout(() => {
              resetButton.style.transform = ''
            }, 150)
          }, 100)
        })

        // ============ 难度选择 ============
        function updateDifficultyButtons() {
          difficultyButtons.forEach((btn) => {
            const diff = btn.dataset.difficulty
            if (diff === currentDifficulty) {
              btn.classList.add('difficulty-active')
            } else {
              btn.classList.remove('difficulty-active')
            }
          })
        }

        difficultyButtons.forEach((btn) => {
          btn.addEventListener('click', function () {
            const diff = this.dataset.difficulty
            if (diff !== currentDifficulty) {
              currentDifficulty = diff
              initGame()
            }
          })
        })

        // ============ 窗口大小调整 ============
        let resizeDebounce = null
        window.addEventListener('resize', function () {
          clearTimeout(resizeDebounce)
          resizeDebounce = setTimeout(() => {
            calculateCellSize()
            updateGridStyle()
            updateAllCells()
          }, 250)
        })

        // ============ 移动端触摸优化 ============
        // 在移动端为格子添加更大的触摸区域感知
        let longPressTimer = null
        gameBoard.addEventListener(
          'touchstart',
          function (event) {
            const cellEl = event.target.closest('[data-row]')
            if (!cellEl) return
            if (gameState === 'lost' || gameState === 'won') return

            const r = parseInt(cellEl.dataset.row)
            const c = parseInt(cellEl.dataset.col)

            // 长按500ms触发标记（作为右键的替代）
            longPressTimer = setTimeout(() => {
              if (!board[r][c].revealed && gameState === 'playing') {
                toggleFlag(r, c)
                // 添加触觉反馈（如果支持）
                if (navigator.vibrate) {
                  navigator.vibrate(15)
                }
              }
              longPressTimer = null
            }, 500)
          },
          { passive: true },
        )

        gameBoard.addEventListener('touchend', function () {
          if (longPressTimer) {
            clearTimeout(longPressTimer)
            longPressTimer = null
          }
        })

        gameBoard.addEventListener('touchmove', function () {
          if (longPressTimer) {
            clearTimeout(longPressTimer)
            longPressTimer = null
          }
        })

        // ============ 启动游戏 ============
        initGame()

        // ============ 输出信息 ============
        console.log('💣 扫雷游戏已就绪！')
        console.log('  🖱️ 左键点击：挖掘 | 右键点击：标记旗帜')
        console.log('  📱 移动端：切换模式按钮 | 长按标记')
        console.log('  ⌨️ 键盘快捷键：F切换模式 | R重新开始')
        console.log('  🎯 难度：初级9×9 | 中级16×16 | 高级30×16')
        console.log('  💡 点击已揭开的数字可自动展开周围安全格')
      })()
    </script>
  </body>
</html>
